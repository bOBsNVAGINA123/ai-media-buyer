name: OurKids Ad Bot

# Daily recommendations. Reads Meta, Odoo and Shopify; writes only to the Ad Desk database
# and sends the phone notification. Changes to Meta happen only when an action is approved in the app.
on:
  schedule:
    # 07:17 Cairo (04:17 UTC) daily; off the top of the hour, where GitHub drops scheduled jobs
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      raw:
        description: "Also save the year of raw ad-weeks (for analysis)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ourkids-adbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pywebpush
      - name: Pull data and build recommendations
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_ID: ${{ secrets.META_ACCOUNT_ID }}
          ODOO_SERVER: ${{ secrets.ODOO_SERVER }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_LOGIN: ${{ secrets.ODOO_LOGIN }}
          ODOO_APIKEY: ${{ secrets.ODOO_APIKEY }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SUPABASE_URL: https://vnrxkekoqftknzjayxpx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          ADBOT_RAW: ${{ inputs.raw && '../out/adbot_raw.json' || '' }}
        run: |
          mkdir -p out
          cd adbot && python engine.py ../out/adbot_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adbot
          path: out/
          retention-days: 1
