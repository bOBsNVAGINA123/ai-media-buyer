name: Playmore Odoo probe
# One-off reads of Playmore's Odoo for building its P&L. Prints names and totals only, never secrets.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Survey
        env:
          LOGIN: ${{ secrets.PLAYMORE_ODOO_LOGIN }}
          KEY: ${{ secrets.PLAYMORE_ODOO_APIKEY }}
        run: python3 playmore/playmore_explore.py
