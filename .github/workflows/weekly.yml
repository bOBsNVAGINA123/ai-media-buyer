name: AI Media Buyer — Weekly Strategic Advisor

# ── Weekly strategic brief per account. Runs on GitHub's servers. ──
# Posts to #strategic-advisor-ourkids and #strategic-advisor-playmore.
on:
  schedule:
    # Saturday 06:00 UTC = 9AM Cairo (summer). Start-of-week planning brief.
    - cron: "17 6 * * 6"
  workflow_dispatch: {}   # also triggerable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: media-buyer-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the weekly strategic advisor
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python analyze.py --weekly

      - name: Alert on job failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\":\"C0BFN4UGYKY\",\"text\":\":rotating_light: <@U082VCLRZ6E> AI Media Buyer weekly advisor FAILED.\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      # Keep the password-protected mirror in step with what we just built.
      # The whole docs/ tree is deployed, so all three apps (Growth Operator,
      # Strategic, OurKids) and their payloads stay in sync there.
      - name: Publish to the private mirror (fallback -- Git integration is primary)
        if: always()
        continue-on-error: true
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # v12.9 NO `cd docs`. The Vercel project's Root Directory is already `docs`, and
          # Vercel applies it on top of whatever is uploaded -- so `cd docs` resolved to
          # docs/docs and this step failed EVERY night from 18 Sep to 27 Sep 2026. The same
          # bug was fixed in ourkids.yml/ourkids-heavy.yml back in v9.11 (5 Aug) and these
          # two siblings were left behind, failing hard because they carry no
          # continue-on-error. Hardened the same way: never mask the exit status behind a
          # pipeline, and warn instead of failing the whole run -- the Git integration is
          # the primary publisher, this is only the fallback.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=Vercel mirror skipped::VERCEL_TOKEN is empty. The Git integration publishes the mirror."
            exit 0
          fi
          set +e
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" > /tmp/v.log 2>&1
          rc=$?
          cat /tmp/v.log
          if [ $rc -eq 0 ]; then
            echo "mirror published"
          else
            if grep -q "not valid" /tmp/v.log; then
              echo "::warning title=Vercel token expired::VERCEL_TOKEN is rejected. Mint a NO-EXPIRATION token."
            else
              echo "::warning title=Vercel mirror failed::See the log above. The Git integration still publishes the mirror."
            fi
          fi
