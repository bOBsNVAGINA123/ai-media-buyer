<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
:root{--ink:#161d2e;--mut:#7c869c;--red:#e23a63;--grn:#12b886;--teal:#1fc3b6;--blue:#3a9bff;--indigo:#5a5bf0;--violet:#9d6bff;--orange:#ff8b42;--pink:#ff5da2;--grey:#9aa3b5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(180deg,#e7ecf6,#eef1f7 240px);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1520px;margin:0 auto;padding:20px 22px 70px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:10px}

.sp{flex:1}.banner{background:#fff7ed;border:1px solid #ffe1bf;color:#8a5a1e;border-radius:11px;padding:9px 13px;font-size:11.5px;margin-bottom:12px;line-height:1.55}

.card.full{grid-column:1/-1}

.drag{position:absolute;top:12px;left:9px;color:#cfd5e2;cursor:grab;font-size:13px;user-select:none}.card.drg{opacity:.4}
.xp{position:absolute;top:10px;right:12px;color:#9aa3b5;cursor:pointer;font-size:15px;font-weight:800;padding:2px 6px;border-radius:7px}.xp:hover{background:#eef0fb;color:#5a5bf0}

.info:hover::after{content:attr(data-t);position:absolute;left:16px;top:0;width:300px;background:#161d2e;color:#fff;font-size:11px;font-weight:500;line-height:1.5;padding:8px 10px;border-radius:8px;z-index:40;white-space:normal}
.cs{font-size:10.5px;color:var(--mut);margin-top:2px;font-weight:600}
.bg{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:20px;margin-left:6px;text-transform:uppercase}
.b-odoo{background:#eae9ff;color:#5a5bf0}.b-shop{background:#e5f7ee;color:#12a06e}.b-meta{background:#e6f0ff;color:#2f7fe0}.b-blend{background:#e4f7f4;color:#12b0a4}.b-live{background:#e5f7ee;color:#12a06e}
.kpis{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}.kpi{text-align:right}.kpi .l{font-size:11px;color:var(--mut);font-weight:600}.kpi .v{font-size:20px;font-weight:800;line-height:1.15}.kpi .d{font-size:11px;font-weight:700;margin-top:1px}
.up{color:var(--grn)}.dn{color:var(--red)}.ft{color:var(--mut)}
.cv{position:relative;height:150px;margin-top:8px}.lgd{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:7px;font-size:11px;color:#5a637a}
.lg{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 4px;border-radius:6px}.lg.off{opacity:.32;text-decoration:line-through}.sw{width:13px;height:3px;border-radius:2px}
.chan .r{display:flex;align-items:center;gap:10px;margin:8px 0}.chan .n{width:86px;font-size:12.5px;font-weight:700}.chan .t{flex:1;height:11px;background:#f0f2f7;border-radius:7px;overflow:hidden}.chan .f{height:100%;border-radius:7px}.chan .vl{width:170px;text-align:right;font-size:12px;font-weight:700}
table.bt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}table.bt th{text-align:right;color:var(--mut);font-size:10px;text-transform:uppercase;padding:6px 7px;border-bottom:1px solid #eef0f5}table.bt th:first-child{text-align:left}table.bt td{padding:6px 7px;border-bottom:1px solid #f4f6fa;text-align:right}table.bt td:first-child{text-align:left;font-weight:700}table.bt input{width:88px;text-align:right;padding:4px 6px;font-size:12px}
.tg{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px}.tg.a{background:#e5f7ee;color:#12a06e}.tg.b{background:#fde8ee;color:#e23a63}
.ins .row{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f4f6fa;font-size:12.5px;line-height:1.5}

.gate{position:fixed;inset:0;background:linear-gradient(135deg,#20264a,#3a2f6e);display:flex;align-items:center;justify-content:center;z-index:99}.gate .bx{background:#fff;border-radius:20px;padding:34px 30px;width:340px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}.gate .l2{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--indigo),var(--blue));margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}.gate h2{margin:0 0 4px;font-size:19px}.gate p{margin:0 0 18px;color:var(--mut);font-size:13px}.gate input{width:100%;padding:12px;font-size:15px;text-align:center;margin-bottom:12px}.gate .btn{width:100%;padding:12px;font-size:15px}.err{color:var(--red);font-size:12.5px;height:16px;margin-top:8px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(20,26,46,.55);display:flex;align-items:center;justify-content:center;z-index:80}
.mbox{background:#fff;border-radius:18px;padding:20px 22px;width:min(1100px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mx{float:right;cursor:pointer;font-size:18px;font-weight:800;color:#9aa3b5;padding:2px 8px;border-radius:8px}.mx:hover{background:#eef0fb;color:#5a5bf0}
.hide{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="gate" id="gate"><div class="bx"><div class="l2">OK</div><h2>OurKids Analytics</h2><p>Enter password to continue</p>
<input id="pw" type="password" placeholder="Password" autocomplete="off"/><button class="btn" onclick="unlock()">Unlock</button><div class="err" id="er"></div></div></div>
<div class="wrap hide" id="app">
<div class="top"><div class="brand"><div class="logo">OK</div><div><h1>OurKids — Performance</h1><div class="sub">shop-ourkids.com · Odoo · Shopify · Meta · Google · TikTok</div></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><div class="pill" id="pp"></div><div class="pill" id="sync"></div><div class="pill">Currency <b>EGP</b></div></div></div>
<div class="tabs"><div class="tab on" id="t1" onclick="tab('on')">Online</div><div class="tab" id="t2" onclick="tab('off')">Offline / Branches</div></div>
<div id="onC"><div class="bar"><label>Range</label><span id="pre"></span><label style="margin-left:6px">From</label><input type="date" id="d0"/><label>To</label><input type="date" id="d1"/><div class="sp"></div>
<label>Compare</label><select id="cm" onchange="ST.cmp=this.value;rOn()"><option value="off">Off</option><option value="prev" selected>Previous period</option></select>
<label>Attribution</label><select id="at"></select><label>Sort</label><select id="so" onchange="rOn()"><option value="def">Manual (drag)</option><option value="gain">Biggest gain</option><option value="drop">Biggest drop</option></select></div>
<div class="banner" id="bn"></div><div class="grid" id="g1"></div></div>
<div id="offC" class="hide"><div class="bar"><label>Attribution</label><select id="at2"></select><label style="margin-left:8px">GP %</label><input id="gp" style="width:60px" value="26.6"/><label>Refund %</label><input id="rf" style="width:60px" value="17.5"/><label>Growth %</label><input id="tgt" style="width:56px" value="10"/><label><input type="checkbox" id="oh" style="width:auto"> load overhead</label><div class="sp"></div><button class="btn g" onclick="resetOff()">Reset</button></div>
<div class="banner" id="bn2"></div><div class="grid" id="g2"></div></div>
<div class="foot" id="ft"></div></div>
<div id="mwrap"></div>
<script>
const HASH="9f97837eb237a58b0b15c0b0962b450c131d5ddbade4ac2ca88b34b451600745";
async function unlock(){const v=document.getElementById('pw').value;const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const x=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');if(x===HASH){document.getElementById('gate').classList.add('hide');document.getElementById('app').classList.remove('hide');boot();}else document.getElementById('er').textContent='Wrong password';}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
const C={teal:'#1fc3b6',blue:'#3a9bff',indigo:'#5a5bf0',violet:'#9d6bff',orange:'#ff8b42',pink:'#ff5da2',grn:'#12b886',red:'#e23a63',grey:'#9aa3b5'};
const CHC={Shopify:C.indigo,Noon:C.blue,Amazon:C.violet,Homzmart:C.teal};
const ANNC={event:C.indigo,spike:C.grn,drop:C.red,refund:C.orange};
let O,FF,ch=[],TAB='on',IO=null,ST={s:null,e:null,at:'default',cmp:'prev',ord:null};
const fC=v=>'E£ '+Math.round(v).toLocaleString(),fI=v=>Math.round(v).toLocaleString(),fP=v=>(+v).toFixed(2)+'%',fX=v=>(+v).toFixed(2)+'x';
const FM={cur:fC,n:fI,pct:fP,x:fX};
function dl(c,p,gu=1){if(c==null||p==null||!isFinite(c)||!isFinite(p)||(p===0&&c===0))return{cls:'ft',t:'—',p:0};if(!p)return{cls:'ft',t:'new',p:0};const d=c-p,pc=d/p*100;const cls=Math.abs(pc)<.05?'ft':((d>=0)===!!gu?'up':'dn');return{p:pc,cls,t:(d>=0?'+':'−')+Math.abs(pc).toFixed(1)+'% vs prev'};}
function dCh(){ch.forEach(c=>{try{c.destroy()}catch(e){}});ch=[];if(IO){IO.disconnect();IO=null;}}
const SC={rev:1000,gp:1000,refund:1000,orders:1};let DD=[];
function isoDates(){DD=[];const d0=new Date(O.fin.start+'T00:00:00Z');for(let i=0;i<O.fin.n;i++){const d=new Date(d0);d.setUTCDate(d.getUTCDate()+i);DD.push(d.toISOString().slice(0,10));}}
function idxOf(iso,dir){let lo=0,hi=DD.length-1,r=dir>0?DD.length:-1;while(lo<=hi){const m=(lo+hi)>>1;if(DD[m]>=iso){if(dir>0)r=m;hi=m-1;}else{if(dir<0)r=m;lo=m+1;}}return r;}
function rng(s,e){const i0=idxOf(s,1),i1=idxOf(e,-1);return(i0<0||i1<0||i0>i1)?null:[i0,i1];}
function fSum(k,s,e){const r=rng(s,e);if(!r)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=O.fin[k][i]||0;return t*(SC[k]||1);}
function fChan(s,e){const r=rng(s,e),o={};Object.keys(O.fin.chD).forEach(c=>o[c]=0);if(!r)return o;for(let i=r[0];i<=r[1];i++)Object.keys(o).forEach(c=>o[c]+=(O.fin.chD[c][i]||0)*1000);return o;}
function aD(i){const d=new Date(O.ad.start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10);}
function aRange(s,e){const st=O.ad.start,en=aD(O.ad.n-1),os=s>st?s:st,oe=e<en?e:en;if(os>oe)return null;return[Math.max(0,Math.round((Date.parse(os)-Date.parse(st))/864e5)),Math.min(O.ad.n-1,Math.round((Date.parse(oe)-Date.parse(st))/864e5))];}
function aSum(k,r){let t=0;for(let i=r[0];i<=r[1];i++)t+=O.ad[k][i]||0;return t;}
function aAvg(k,r){let t=0,n=0;for(let i=r[0];i<=r[1];i++){if(O.ad[k][i]){t+=O.ad[k][i];n++;}}return n?t/n:0;}
function af(p){return O.attr[p][ST.at];}
function addD(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function span(s,e){return Math.round((Date.parse(e)-Date.parse(s))/864e5)+1;}
function bD(i){const d=new Date(O.bl.start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10);}
function bSum(name,r){if(!r)return 0;const a=O.bl.b[name]||[];let t=0;for(let i=r[0];i<=r[1];i++)t+=a[i]||0;return t;}
function dec(L,d,max){max=max||170;const n=L.length;if(n<=max)return{L:L.slice(),d:d.slice(),ix:L.map((_,i)=>i)};const out={L:[],d:[],ix:[]},st=n/max;for(let b=0;b<max;b++){const s=Math.floor(b*st),e=Math.min(n,Math.floor((b+1)*st));let sm=0,c=0;for(let i=s;i<e;i++){sm+=d[i];c++;}out.L.push(L[s]);out.d.push(sm/(c||1));out.ix.push(e-1);}return out;}

function boot(){O=window.O;FF=window.F;isoDates();
 const nx=(function(){try{const t=Date.parse((O.lastSync||'').replace(' UTC','Z').replace(' ','T'));return new Date(t+3*3600*1000).toISOString().slice(11,16)+' UTC';}catch(e){return '—';}})();document.getElementById('sync').innerHTML='↻ Synced <b>'+(O.lastSync||'—')+'</b> · next ~<b>'+nx+'</b>';
 ST.e=O.aw[1];ST.s=addD(ST.e,-29);
 const d0=document.getElementById('d0'),d1=document.getElementById('d1');
 d0.value=ST.s;d1.value=ST.e;d0.min=O.fin.start;d1.max=ST.e;
 document.getElementById('pre').innerHTML=[['30d',30],['90d',90],['6m',182],['12m',365],['YTD','ytd'],['All',9999]].map(p=>`<span class="chip" onclick="pre('${p[1]}')">${p[0]}</span>`).join(' ');
 const op=O.attr.order.map(k=>`<option value="${k}">${O.attr.labels[k]}</option>`).join('');
 document.getElementById('at').innerHTML=op;document.getElementById('at2').innerHTML=op;
 document.getElementById('at').onchange=e=>{ST.at=e.target.value;document.getElementById('at2').value=e.target.value;rOn();};
 document.getElementById('at2').onchange=e=>{ST.at=e.target.value;document.getElementById('at').value=e.target.value;rOff();};
 d0.onchange=e=>{ST.s=e.target.value;rOn();};d1.onchange=e=>{ST.e=e.target.value;rOn();};
 ['gp','rf','tgt'].forEach(id=>document.getElementById(id).oninput=rOff);document.getElementById('oh').onchange=rOff;
 cards();rOn();
 document.getElementById('ft').innerHTML='Sources — Revenue/GP/orders/returns/channels: Odoo (daily). Branch retail revenue: Odoo POS journal accounting (daily, REAL). Sessions/funnel: Shopify. Spend + ROAS: Meta·Google·TikTok. Default attribution live; other windows modeled. Auto-synced every 3 hours.';}
function pre(p){const last=O.aw[1];if(p==='ytd')ST.s=last.slice(0,4)+'-01-01';else if(+p>=9999)ST.s=O.fin.start;else ST.s=addD(last,-(+p-1));ST.e=last;document.getElementById('d0').value=ST.s;document.getElementById('d1').value=ST.e;rOn();}
function tab(t){TAB=t;document.getElementById('t1').classList.toggle('on',t==='on');document.getElementById('t2').classList.toggle('on',t==='off');document.getElementById('onC').classList.toggle('hide',t!=='on');document.getElementById('offC').classList.toggle('hide',t!=='off');if(t==='on')rOn();else rOff();}

function calc(){const s=ST.s,e=ST.e,ln=span(s,e),cs=addD(s,-ln),ce=addD(s,-1);
 const o={cs,ce};const G=(k,a,b)=>fSum(k,a,b);
 o.gross=[G('rev',s,e),G('rev',cs,ce)];o.ref=[G('refund',s,e),G('refund',cs,ce)];o.net=[o.gross[0]-o.ref[0],o.gross[1]-o.ref[1]];
 o.gp=[G('gp',s,e),G('gp',cs,ce)];o.ord=[G('orders',s,e),G('orders',cs,ce)];
 o.aov=[o.ord[0]?o.gross[0]/o.ord[0]:0,o.ord[1]?o.gross[1]/o.ord[1]:0];o.gpp=[o.ord[0]?o.gp[0]/o.ord[0]:0,o.ord[1]?o.gp[1]/o.ord[1]:0];
 o.gpct=[o.gross[0]?o.gp[0]/o.gross[0]*100:0,o.gross[1]?o.gp[1]/o.gross[1]*100:0];
 o.ch=fChan(s,e);o.chP=fChan(cs,ce);
 const ra=aRange(s,e),rc=aRange(cs,ce);o.ad=!!ra;o.ra=ra;o.rc=rc;
 if(ra){const S=k=>aSum(k,ra),P=k=>rc?aSum(k,rc):null;
  const sp=S('spend'),spc=P('spend');
  const gv=S('gecomrev')*af('google'),mv=S('mecomrev')*af('meta'),tv=S('ttValue')*af('tt'),om=S('metaOmniValue')*af('meta');
  const gvc=rc?P('gecomrev')*af('google'):null,mvc=rc?P('mecomrev')*af('meta'):null,tvc=rc?P('ttValue')*af('tt'):null,omc=rc?P('metaOmniValue')*af('meta'):null;
  o.sp=[sp,spc];o.msp=[S('mspend'),P('mspend')];o.gsp=[S('gspend'),P('gspend')];o.tsp=[S('tspend'),P('tspend')];
  o.broas=[sp?(gv+mv+tv)/sp:0,spc?(gvc+mvc+tvc)/spc:null];
  o.groas=[S('gspend')?gv/S('gspend'):0,rc&&P('gspend')?gvc/P('gspend'):null];
  o.mroas=[S('mspend')?mv/S('mspend'):0,rc&&P('mspend')?mvc/P('mspend'):null];
  o.troas=[S('tspend')?tv/S('tspend'):0,rc&&P('tspend')?tvc/P('tspend'):null];
  o.totroas=[sp?(gv+om+tv)/sp:0,spc?(gvc+omc+tvc)/spc:null];
  o.instore=[S('instoreMeta')*af('meta'),rc?P('instoreMeta')*af('meta'):null];
  o.sess=[S('sessions'),P('sessions')];o.nc=[S('newcust'),P('newcust')];o.rcn=[S('retcust'),P('retcust')];
  o.cac=[o.nc[0]?sp/o.nc[0]:0,rc&&o.nc[1]?spc/o.nc[1]:null];
  o.mer=[sp?o.net[0]/sp:0,spc?o.net[1]/spc:null];
  o.cacgp=[o.gpp[0]&&o.nc[0]?(sp/o.nc[0])/o.gpp[0]:0,rc&&o.gpp[1]&&o.nc[1]?(spc/o.nc[1])/o.gpp[1]:null];
  o.ncrev=[S('ncrev'),P('ncrev')];o.rcrev=[S('rcrev'),P('rcrev')];
  o.amer=[sp?o.ncrev[0]/sp:0,spc&&o.ncrev[1]?o.ncrev[1]/spc:null];
  o.ncaov=[o.nc[0]?o.ncrev[0]/o.nc[0]:0,rc&&o.nc[1]?o.ncrev[1]/o.nc[1]:null];
  o.rcaov=[o.rcn[0]?o.rcrev[0]/o.rcn[0]:0,rc&&o.rcn[1]?o.rcrev[1]/o.rcn[1]:null];
