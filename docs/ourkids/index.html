<style>
:root{--ink:#161d2e;--mut:#7c869c;--red:#e23a63;--grn:#12b886;--teal:#1fc3b6;--blue:#3a9bff;--indigo:#5a5bf0;--violet:#9d6bff;--orange:#ff8b42;--pink:#ff5da2;--grey:#9aa3b5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(180deg,#e7ecf6,#eef1f7 240px);color:var(--ink);-webkit-font-smoothing:antialiased}

.kpis{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}.kpi{text-align:right}.kpi .l{font-size:11px;color:var(--mut);font-weight:600}.kpi .v{font-size:20px;font-weight:800;line-height:1.15}.kpi .d{font-size:11px;font-weight:700;margin-top:1px}

.cv{position:relative;height:150px;margin-top:8px}.lgd{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:7px;font-size:11px;color:#5a637a}
.lg{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 4px;border-radius:6px}.lg.off{opacity:.32;text-decoration:line-through}.sw{width:13px;height:3px;border-radius:2px}
.chan .r{display:flex;align-items:center;gap:10px;margin:8px 0}.chan .n{width:86px;font-size:12.5px;font-weight:700}.chan .t{flex:1;height:11px;background:#f0f2f7;border-radius:7px;overflow:hidden}.chan .f{height:100%;border-radius:7px}.chan .vl{width:170px;text-align:right;font-size:12px;font-weight:700}
table.bt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}table.bt th{text-align:right;color:var(--mut);font-size:10px;text-transform:uppercase;padding:6px 7px;border-bottom:1px solid #eef0f5}table.bt th:first-child{text-align:left}table.bt td{padding:6px 7px;border-bottom:1px solid #f4f6fa;text-align:right}table.bt td:first-child{text-align:left;font-weight:700}table.bt input{width:88px;text-align:right;padding:4px 6px;font-size:12px}
table.bt th[title],table.bt td[title]{position:relative;cursor:help}table.bt th[title]:hover::after,table.bt td[title]:hover::after{content:attr(title);position:absolute;right:0;top:100%;min-width:210px;max-width:300px;background:#161d2e;color:#fff;font-size:11px;font-weight:500;line-height:1.5;padding:8px 10px;border-radius:8px;z-index:50;white-space:normal;text-align:left;text-transform:none}
.grid{align-items:start}

.gate{position:fixed;inset:0;background:linear-gradient(135deg,#20264a,#3a2f6e);display:flex;align-items:center;justify-content:center;z-index:99}.gate .bx{background:#fff;border-radius:20px;padding:34px 30px;width:340px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}.gate .l2{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--indigo),var(--blue));margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}.gate h2{margin:0 0 4px;font-size:19px}.gate p{margin:0 0 18px;color:var(--mut);font-size:13px}.gate input{width:100%;padding:12px;font-size:15px;text-align:center;margin-bottom:12px}.gate .btn{width:100%;padding:12px;font-size:15px}.err{color:var(--red);font-size:12.5px;height:16px;margin-top:8px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(20,26,46,.55);display:flex;align-items:center;justify-content:center;z-index:80}
.mbox{background:#fff;border-radius:18px;padding:20px 22px;width:min(1100px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mx{float:right;cursor:pointer;font-size:18px;font-weight:800;color:#9aa3b5;padding:2px 8px;border-radius:8px}.mx:hover{background:#eef0fb;color:#5a5bf0}
.hide{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body>

<script>
const HASH="9f97837eb237a58b0b15c0b0962b450c131d5ddbade4ac2ca88b34b451600745";
async function unlock(){const v=document.getElementById('pw').value;const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const x=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');if(x===HASH){document.getElementById('gate').classList.add('hide');document.getElementById('app').classList.remove('hide');boot();}else document.getElementById('er').textContent='Wrong password';}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
const C={teal:'#1fc3b6',blue:'#3a9bff',indigo:'#5a5bf0',violet:'#9d6bff',orange:'#ff8b42',pink:'#ff5da2',grn:'#12b886',red:'#e23a63',grey:'#9aa3b5'};
const CHC={Shopify:C.indigo,Noon:C.blue,Amazon:C.violet,Homzmart:C.teal};
const ANNC={event:C.indigo,spike:C.grn,drop:C.red,refund:C.orange};
let O,FF,ch=[],TAB='on',IO=null,ST={s:null,e:null,at:'default',att:{meta:'default',google:'default',tt:'default'},cmp:'prev',ord:null,pm0:null,pm1:null,pcust:'nc'};
const fC=v=>'E£ '+Math.round(v).toLocaleString(),fI=v=>Math.round(v).toLocaleString(),fP=v=>(+v).toFixed(2)+'%',fX=v=>(+v).toFixed(2)+'x';
const FM={cur:fC,n:fI,pct:fP,x:fX};
function dl(c,p,gu=1){if(c==null||p==null||!isFinite(c)||!isFinite(p)||(p===0&&c===0))return{cls:'ft',t:'—',p:0};if(!p)return{cls:'ft',t:'new',p:0};const d=c-p,pc=d/p*100;const cls=Math.abs(pc)<.05?'ft':((d>=0)===!!gu?'up':'dn');return{p:pc,cls,t:(d>=0?'+':'−')+Math.abs(pc).toFixed(1)+'% vs prev'};}
function dCh(){ch.forEach(c=>{try{c.destroy()}catch(e){}});ch=[];if(IO){IO.disconnect();IO=null;}}
const SC={rev:1000,gp:1000,refund:1000,orders:1};let DD=[];
function isoDates(){DD=[];const d0=new Date(O.fin.start+'T00:00:00Z');for(let i=0;i<O.fin.n;i++){const d=new Date(d0);d.setUTCDate(d.getUTCDate()+i);DD.push(d.toISOString().slice(0,10));}}
function idxOf(iso,dir){let lo=0,hi=DD.length-1,r=dir>0?DD.length:-1;while(lo<=hi){const m=(lo+hi)>>1;if(DD[m]>=iso){if(dir>0)r=m;hi=m-1;}else{if(dir<0)r=m;lo=m+1;}}return r;}
function rng(s,e){const i0=idxOf(s,1),i1=idxOf(e,-1);return(i0<0||i1<0||i0>i1)?null:[i0,i1];}
function fSum(k,s,e){const r=rng(s,e);if(!r)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=O.fin[k][i]||0;return t*(SC[k]||1);}
function fShop(s,e){const r=rng(s,e);if(!r)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=(O.fin.chD.Shopify[i]||0)*1000;return t;}
function fChan(s,e){const r=rng(s,e),o={};Object.keys(O.fin.chD).forEach(c=>o[c]=0);if(!r)return o;for(let i=r[0];i<=r[1];i++)Object.keys(o).forEach(c=>o[c]+=(O.fin.chD[c][i]||0)*1000);return o;}
function aD(i){const d=new Date(O.ad.start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10);}
function aRange(s,e){const st=O.ad.start,en=aD(O.ad.n-1),os=s>st?s:st,oe=e<en?e:en;if(os>oe)return null;return[Math.max(0,Math.round((Date.parse(os)-Date.parse(st))/864e5)),Math.min(O.ad.n-1,Math.round((Date.parse(oe)-Date.parse(st))/864e5))];}
function aSum(k,r){const A=O.ad[k];if(!A)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=A[i]||0;return t;}
function aAvg(k,r){const A=O.ad[k];if(!A)return 0;let t=0,n=0;for(let i=r[0];i<=r[1];i++){if(A[i]){t+=A[i];n++;}}return n?t/n:0;}
function af(p){const k=(ST.att&&ST.att[p])||ST.at;const v=(O.attr[p]||{})[k];return v==null?1:v;}
function addD(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function span(s,e){return Math.round((Date.parse(e)-Date.parse(s))/864e5)+1;}
function bD(i){const d=new Date(O.bl.start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10);}
function bSum(name,r){if(!r)return 0;const a=O.bl.b[name]||[];let t=0;for(let i=r[0];i<=r[1];i++)t+=a[i]||0;return t;}
function dec(L,d,max){max=max||120;const n=L.length;if(n<=max)return{L:L.slice(),d:d.slice(),ix:L.map((_,i)=>i)};const out={L:[],d:[],ix:[]},st=n/max;for(let b=0;b<max;b++){const s=Math.floor(b*st),e=Math.min(n,Math.floor((b+1)*st));let sm=0,c=0;for(let i=s;i<e;i++){sm+=d[i];c++;}out.L.push(L[s]);out.d.push(sm/(c||1));out.ix.push(e-1);}return out;}

function cairo(u){try{const t=Date.parse(String(u).replace(' UTC','Z').replace(' ','T'));const d=new Date(t+3*3600*1000);let h=d.getUTCHours(),mi=('0'+d.getUTCMinutes()).slice(-2);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+mi+' '+ap;}catch(e){return String(u);}}
let LSC='—',NXC='—';
function boot(){O=window.O;FF=window.F;isoDates();LSC=cairo(O.lastSync);try{NXC=cairo(new Date(Date.parse(String(O.lastSync).replace(' UTC','Z').replace(' ','T'))+3*3600*1000).toISOString().replace('T',' ').slice(0,16)+' UTC');}catch(e){}
 document.getElementById('sync').innerHTML='↻ Synced <b>'+LSC+'</b> Cairo · next ~<b>'+NXC+'</b>';
 ST.e=O.aw[1];ST.s=addD(ST.e,-29);
 const d0=document.getElementById('d0'),d1=document.getElementById('d1');
 d0.value=ST.s;d1.value=ST.e;d0.min=O.fin.start;d1.max=ST.e;
 document.getElementById('pre').innerHTML=[['L7D',7],['MTD','mtd'],['30d',30],['60d',60],['90d',90],['180d',180],['365d',365],['YTD','ytd'],['All',9999]].map(p=>`<span class="chip" onclick="pre('${p[1]}')">${p[0]}</span>`).join(' ');
 const SL={'default':'LIVE 7DC/1DV','7dc':'7d click','1dc':'1d click','incr':'Incremental'};
 [['am','meta'],['ag','google'],['ax','tt']].forEach(pr=>{const op2=O.attr.order.filter(k=>(O.attr[pr[1]]||{})[k]!=null).map(k=>`<option value="${k}">${SL[k]||k}</option>`).join('');
  [pr[0],pr[0]+'2'].forEach(id=>{const el=document.getElementById(id);el.innerHTML=op2;el.value=ST.att[pr[1]];
   el.onchange=e=>{ST.att[pr[1]]=e.target.value;document.getElementById(id===pr[0]?pr[0]+'2':pr[0]).value=e.target.value;if(TAB==='off')rOff();else rOn();};});});
 d0.onchange=e=>{ST.s=e.target.value;rOn();};d1.onchange=e=>{ST.e=e.target.value;rOn();};
 document.getElementById('c0').onchange=rOn;document.getElementById('c1').onchange=rOn;
 ['gp','rf','tgt'].forEach(id=>document.getElementById(id).oninput=rOff);document.getElementById('oh').onchange=rOff;
 cards();rOn();
 document.getElementById('ft').innerHTML='Sources — Revenue/GP/orders/returns/channels: Odoo (daily). Branch retail revenue: Odoo POS journal accounting (daily, REAL). Sessions/funnel: Shopify. Spend + ROAS: Meta·Google·TikTok. Default attribution live; other windows modeled. Auto-synced every 3 hours. · <b>v4.9</b>';}
function pre(p){const last=O.aw[1];if(p==='ytd')ST.s=last.slice(0,4)+'-01-01';else if(p==='mtd')ST.s=last.slice(0,8)+'01';else if(+p>=9999)ST.s=O.fin.start;else ST.s=addD(last,-(+p-1));ST.e=last;document.getElementById('d0').value=ST.s;document.getElementById('d1').value=ST.e;rOn();}
function tab(t){TAB=t;[['t1','on'],['t2','off'],['t3','pl'],['t4','pn'],['t5','me']].forEach(x=>document.getElementById(x[0]).classList.toggle('on',t===x[1]));document.getElementById('onC').classList.toggle('hide',t!=='on');document.getElementById('offC').classList.toggle('hide',t!=='off');document.getElementById('plC').classList.toggle('hide',t!=='pl');document.getElementById('pnC').classList.toggle('hide',t!=='pn');document.getElementById('meC').classList.toggle('hide',t!=='me');if(t==='on')rOn();else if(t==='off')rOff();else if(t==='pl')rPlan();else if(t==='pn')rPnl();else rMedia();}

function cmpSel(v){ST.cmp=v;const sh=v!=='custom';['cl0','c0','cl1','c1'].forEach(id=>document.getElementById(id).classList.toggle('hide',sh));rOn();}
function cmpW(){const ln=span(ST.s,ST.e);if(ST.cmp==='custom'){const a=document.getElementById('c0').value,b=document.getElementById('c1').value;if(a&&b&&a<=b)return[a,b];}return ST.cmp==='yoy'?[addD(ST.s,-365),addD(ST.e,-365)]:[addD(ST.s,-ln),addD(ST.s,-1)];}
function shS(k,s2,e2){if(!O.shop||!O.shop[k])return 0;const r=rng(s2,e2);if(!r)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=O.shop[k][i]||0;return t;}
function calc(){const s=ST.s,e=ST.e,w=cmpW(),cs=w[0],ce=w[1];
 const o={cs,ce};const G=(k,a,b)=>fSum(k,a,b);
 o.gross=[G('rev',s,e),G('rev',cs,ce)];o.ref=[G('refund',s,e),G('refund',cs,ce)];o.net=[o.gross[0]-o.ref[0],o.gross[1]-o.ref[1]];

 o.gpct=[o.gross[0]?o.gp[0]/o.gross[0]*100:0,o.gross[1]?o.gp[1]/o.gross[1]*100:0];
 o.ch=fChan(s,e);o.chP=fChan(cs,ce);
 const ra=aRange(s,e),rc=aRange(cs,ce);o.ad=!!ra;o.ra=ra;o.rc=rc;
 if(ra){const S=k=>aSum(k,ra),P=k=>rc?aSum(k,rc):null;
  const sp=S('spend'),spc=P('spend');
  const gv=S('gecomrev')*af('google'),mv=S('mecomrev')*af('meta'),tv=S('ttValue')*af('tt'),om=S('metaOmniValue')*af('meta');
  const gvc=rc?P('gecomrev')*af('google'):null,mvc=rc?P('mecomrev')*af('meta'):null,tvc=rc?P('ttValue')*af('tt'):null,omc=rc?P('metaOmniValue')*af('meta'):null;
  o.sp=[sp,spc];o.msp=[S('mspend'),P('mspend')];o.gsp=[S('gspend'),P('gspend')];o.tsp=[S('tspend'),P('tspend')];
  o.broas=[sp?(gv+mv+tv)/sp:0,spc?(gvc+mvc+tvc)/spc:null];
  o.groas=[S('gspend')?gv/S('gspend'):0,rc&&P('gspend')?gvc/P('gspend'):null];
  o.mroas=[S('mspend')?mv/S('mspend'):0,rc&&P('mspend')?mvc/P('mspend'):null];

  const shNet=(O.shop?(shS('rev',s,e)-shS('ref',s,e))*1000:fShop(s,e)*nf0),shNetP=(O.shop?(shS('rev',cs,ce)-shS('ref',cs,ce))*1000:fShop(cs,ce)*nf1);
  o.merStore=[sp?shNet/sp:0,spc?shNetP/spc:null];

  o.ncrev=[S('ncrev'),P('ncrev')];o.rcrev=[S('rcrev'),P('rcrev')];

   {n:'COGS (actual)',f:m=>SH[m]&&SH[m].g?-(SH[m].g-SH[m].gp):null,fmt:NEG,sh:0,tt:'Gross &minus; Odoo margin, Shopify channel only'},
   {n:'Gross profit',f:m=>SH[m]&&SH[m].g?SH[m].gp:null,fmt:POS,sh:1,b:1},
   {n:'Ads &mdash; Meta',f:m=>A[m]&&A[m].s?-A[m].ms:null,fmt:NEG,sh:0},
   {n:'Ads &mdash; Google',f:m=>A[m]&&A[m].s?-A[m].gs:null,fmt:NEG,sh:0},
   {n:'Ads &mdash; TikTok',f:m=>A[m]&&A[m].s?-A[m].ts:null,fmt:NEG,sh:0,tt:'TikTok API history baked in for the full year'},
   {n:'Ads &mdash; total',f:m=>A[m]&&A[m].s?-A[m].s:null,fmt:NEG,sh:0},
   {n:'Profit contribution',f:m=>SH[m]&&SH[m].g&&A[m]&&A[m].s?SH[m].gp-SH[m].r*(SH[m].gp/SH[m].g)-A[m].s:null,fmt:POS,sh:1,b:1,tt:'GP net of refunded margin &minus; all ads'},
   {n:'OpEx: e-com payroll',f:m=>-EP,fmt:NEG,sh:0,tt:'Fulfilment + marketplace team, Excel Jun-2026'},
   {n:'EBITDA est (Shopify)',f:m=>SH[m]&&SH[m].g&&A[m]&&A[m].s?SH[m].gp-SH[m].r*(SH[m].gp/SH[m].g)-A[m].s-EP:null,fmt:POS,sh:1,b:1},
   null,
   {n:'Orders',f:m=>SH[m]&&SH[m].o?SH[m].o:null,fmt:v=>Math.round(v).toLocaleString(),sh:1},
   {n:'AOV (real)',f:m=>SH[m]&&SH[m].o?SH[m].g/SH[m].o:null,fmt:POS,sh:1},
   {n:'Refunds, %',f:m=>SH[m]&&SH[m].g?SH[m].r/SH[m].g*100:null,fmt:PCT,sh:1,gd:-1},
   {n:'GP margin, %',f:m=>SH[m]&&SH[m].g?SH[m].gp/SH[m].g*100:null,fmt:PCT,sh:1},
   {n:'MER, x (net &divide; ads)',f:m=>SH[m]&&SH[m].g&&A[m]&&A[m].s?(SH[m].g-SH[m].r)/A[m].s:null,fmt:X,sh:1}];
  pnlCard(g,'shop','Shopify &mdash; Monthly P&L (ACTUALS)','The channel ads drive. Real team-tagged refunds, real channel margin, real orders and AOV. Noon/Amazon/Homzmart excluded.',T(SL2,mons));}
 // ---- 2 · OPEX — ACTUAL FROM ACCOUNTING ----
 if(O.exp&&Object.keys(O.exp).length){
  const GRP=['Payroll & benefits','Rent — branches','Rent — HQ / warehouses / flats','Utilities (elec/water/gas)','Packing & bags','Payment & collection fees','Cargo & transport','Offline advertising & gifts','Maintenance','Comms & internet','Other OpEx'];
  const EL=GRP.map(gr=>({n:gr,f:m=>O.exp[m]&&O.exp[m][gr]?-O.exp[m][gr]:null,fmt:NEG,sh:1,gd:-1,tt:gr==='Offline advertising & gifts'?'ADV accounts incl. web/social &mdash; can overlap platform-reported ad spend where agencies invoice through bills':(gr==='Packing & bags'?'Wrapping and plastic bags account &mdash; the packing cost you asked for':'')}))
   .concat([{n:'Total OpEx (accounting)',f:m=>O.exp[m]?-Object.values(O.exp[m]).reduce((a,b)=>a+b,0):null,fmt:NEG,sh:1,gd:-1,b:1}]);
  pnlCard(g,'odoo','OpEx &mdash; ACTUAL Monthly Expenses (Odoo 31.* accounts)','Straight from the posted expense ledger: salaries, real branch rent, utilities, packing, payment-collection fees &mdash; everything readable, by month.',T(EL,mons.filter(m=>O.exp[m])));}
 // ---- 3 · CUSTOMER-TYPE P&L ----
 const ck=ST.pcust;const cmons=mons.filter(m=>A[m]&&(A[m].nc>0||A[m].rc>0));
 if(cmons.length){const gpP=CO.gpPct||0.266;const CV=m=>ck==='nc'?A[m].nc:A[m].rc;
  const CL=[
   {n:'Gross revenue',f:m=>CV(m)||null,fmt:POS,sh:1,tt:'Shopify revenue by customer type'},
   {n:'COGS est ('+((1-gpP)*100).toFixed(1)+'%)',f:m=>CV(m)?-CV(m)*(1-gpP):null,fmt:NEG,sh:0},
   {n:'Gross profit est',f:m=>CV(m)?CV(m)*gpP:null,fmt:POS,sh:1,b:1},
   {n:'Ads (acquisition view)',f:m=>ck==='nc'&&A[m].s?-A[m].s:null,fmt:NEG,sh:0},
   {n:'Profit contribution',f:m=>CV(m)?(ck==='nc'?CV(m)*gpP-(A[m].s||0):CV(m)*gpP):null,fmt:POS,sh:1,b:1},
   {n:ck==='nc'?'aMER, x (new-customer revenue &divide; ad spend)':'Share of online gross, %',f:m=>ck==='nc'?(A[m].s?A[m].nc/A[m].s:null):(M[m]&&M[m].g?A[m].rc/M[m].g*100:null),fmt:ck==='nc'?X:PCT,sh:1}];
  pnlCard(g,'shop',(ck==='nc'?'First-time':'Returning')+' Customers &mdash; Monthly P&L','Switch First-time / Returning in the filter bar above.',T(CL,cmons));}
 // ---- 4 · RETAIL ----
 if(O.bl&&O.bl.n&&names.length){
  const bm=Object.keys(BM).sort().filter(m=>m>=ST.pm0&&m<=ST.pm1);
  if(bm.length){
  const dim=m=>{const y=+m.slice(0,4),mo=+m.slice(5,7);return new Date(Date.UTC(y,mo,0)).getUTCDate();};
  const cov=m=>Math.min(1,(BD[m]||0)/dim(m));
  const h2=T(names.map(n=>({n:n,f:m=>BM[m][n]||0,fmt:POS,sh:1}))
    .concat([{n:'Network',f:m=>names.reduce((a2,n)=>a2+(BM[m][n]||0),0),fmt:POS,sh:1,b:1}]),bm);
  pnlCard(g,'odoo','Retail &mdash; Monthly Revenue by Branch (live POS accounting)','Colour graded per branch across months.',h2);
  const RB=O.rentB||{};const rAvg={};Object.keys(RB).forEach(n=>{const vs=Object.values(RB[n]);rAvg[n]=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:0;});
  const FXB={};FF.branches.forEach(b=>FXB[b.name]=b);
  const bmF=bm.filter(m=>cov(m)>=0.5);
  const netRev=m=>names.reduce((a2,n)=>a2+(BM[m][n]||0),0);
  let h3='';
  names.slice().sort((a,b)=>bm.reduce((s2,m)=>s2+(BM[m][b]||0),0)-bm.reduce((s2,m)=>s2+(BM[m][a]||0),0)).forEach(n=>{
   const B=FXB[n]||{payroll:0};
   const rent=m=>{const v=(RB[n]||{})[m];return v!=null&&v>0?v:rAvg[n]||null;};
   const share=m=>netRev(m)?(BM[m][n]||0)/netRev(m):0;
   const util=m=>{const e=O.exp&&O.exp[m];if(!e)return null;return ((e['Utilities (elec/water/gas)']||0)+(e['Maintenance']||0))*share(m);};
   const mkt=m=>{const a=A[m];if(!a||!a.s)return null;return a.ms*(a.ov?a.io/a.ov:0)*share(m);};
   const contrib=m=>(BM[m][n]||0)*RM-B.payroll*cov(m)-(rent(m)||0)*cov(m)-(util(m)||0)-(mkt(m)||0);
   const BL=[
    {n:'Revenue (POS accounting)',f:m=>BM[m][n]||0,fmt:POS,sh:1},
    {n:'Est. GP net of returns (21.9%)',f:m=>(BM[m][n]||0)*RM,fmt:POS,sh:1,tt:'Odoo GP 26.6% &times; (1 &minus; refund rate 17.5%) &mdash; POS margin not itemised in accounting'},
    {n:'Payroll (Excel, exact)',f:m=>-B.payroll*cov(m),fmt:NEG,sh:0},
    {n:'Rent (ACTUAL accounting)',f:m=>rent(m)!=null?-rent(m)*cov(m):null,fmt:NEG,sh:0,tt:'RENT Branches ledger lines matched to this branch by lease description; months without a posted line use the branch 12-month average. Dokki/Nasr rent partly sits in unlabelled lines.'},
    {n:'Alloc. utilities + maintenance',f:m=>util(m)!=null?-util(m):null,fmt:NEG,sh:0,tt:'Actual electricity/water/gas + maintenance from accounting, allocated by revenue share'},
    {n:'Alloc. Meta in-store spend',f:m=>mkt(m)!=null?-mkt(m):null,fmt:NEG,sh:0,tt:'Meta spend &times; in-store share of omni value &times; branch revenue share &mdash; the marketing cost behind the Meta-attributed walk-ins'},
    {n:'Contribution',f:m=>contrib(m),fmt:POS,sh:1,b:1},
    {n:'Contribution margin, %',f:m=>(BM[m][n]||0)?contrib(m)/(BM[m][n]||1)*100:null,fmt:PCT,sh:1}];
   h3+='<div style="font-weight:800;font-size:13.5px;margin:14px 0 2px">'+n+'</div>'+T(BL,bmF.length?bmF:bm);});
  pnlCard(g,'odoo','Retail &mdash; P&L per Branch (actual rent + allocated marketing)','Revenue &rarr; est. GP &rarr; exact payroll &rarr; ACTUAL rent &rarr; allocated utilities/maintenance &rarr; allocated Meta in-store spend &rarr; contribution. Partial edge months dropped.',h3);
  // ---- 5 · COMPANY P&L — ACTUAL OPEX ----
  const cmb=mons.filter(m=>BM[m]&&O.exp&&O.exp[m]);
  if(cmb.length){
   const retRev=m=>names.reduce((a2,n)=>a2+(BM[m][n]||0),0);
   const onNet=m=>M[m].g-M[m].r,onGpN=m=>M[m].gp*(M[m].g?1-M[m].r/M[m].g:1);
   const opx=m=>Object.values(O.exp[m]).reduce((a,b)=>a+b,0);
   const eb=m=>onGpN(m)+retRev(m)*RM-(A[m]&&A[m].s?A[m].s:0)-opx(m);
   const CM=[
    {n:'Online net revenue (all channels)',f:m=>onNet(m),fmt:POS,sh:1},
    {n:'Retail revenue',f:m=>retRev(m),fmt:POS,sh:1},
    {n:'Total revenue',f:m=>onNet(m)+retRev(m),fmt:POS,sh:1,b:1},
    {n:'Gross profit (online actual + retail est)',f:m=>onGpN(m)+retRev(m)*RM,fmt:POS,sh:1,b:1},
    {n:'Platform ads (Meta+Google+TikTok)',f:m=>A[m]&&A[m].s?-A[m].s:null,fmt:NEG,sh:0,tt:'Platform-reported. Note: parts may ALSO appear in the accounting ADV accounts below &mdash; where agencies invoice through bills the two overlap'},
    {n:'Total OpEx (accounting, all 31.* accounts)',f:m=>-opx(m),fmt:NEG,sh:0,tt:'Salaries, all rent, utilities, packing, collection fees, offline adv, maintenance, comms, vehicles, other &mdash; the real posted expenses'},
    {n:'Company EBITDA est',f:m=>eb(m),fmt:POS,sh:1,b:1,tt:'GP &minus; platform ads &minus; accounting OpEx. Conservative: if agency-billed ad spend is inside the ADV accounts it is counted twice here'},
    {n:'EBITDA, %',f:m=>{const tr2=onNet(m)+retRev(m);return tr2?eb(m)/tr2*100:null;},fmt:PCT,sh:1},
    {n:'MER, x (total rev &divide; platform ads)',f:m=>A[m]&&A[m].s?(onNet(m)+retRev(m))/A[m].s:null,fmt:X,sh:1}];
   let h4=T(CM,cmb);
   const ebv=cmb.map(eb);const pos=ebv.filter(v=>v>0).length;
   h4+='<div class="ins" style="margin-top:8px"><div class="row"><span class="dot" style="background:'+(pos>=cmb.length/2?C.grn:C.red)+'"></span><span>'+pos+' of '+cmb.length+' months EBITDA-positive. Best: '+cmb[ebv.indexOf(Math.max(...ebv))]+' (E&pound; '+money(Math.max(...ebv))+'), worst: '+cmb[ebv.indexOf(Math.min(...ebv))]+' (E&pound; '+money(Math.min(...ebv))+').</span></div></div>';
   pnlCard(g,'ins','Company &mdash; Combined Monthly P&L (ACTUAL OpEx)','Online + retail, with the REAL posted expense ledger as OpEx. Months where POS accounting + expenses both exist.',h4);}
  }}
