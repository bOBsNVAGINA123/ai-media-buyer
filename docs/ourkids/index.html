<script>
const HASH="9f97837eb237a58b0b15c0b0962b450c131d5ddbade4ac2ca88b34b451600745";
async function unlock(){const v=document.getElementById('pw').value;const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const x=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');if(x===HASH){document.getElementById('gate').classList.add('hide');document.getElementById('app').classList.remove('hide');boot();}else document.getElementById('er').textContent='Wrong password';}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
const C={teal:'#1fc3b6',blue:'#3a9bff',indigo:'#5a5bf0',violet:'#9d6bff',orange:'#ff8b42',pink:'#ff5da2',grn:'#12b886',red:'#e23a63',grey:'#9aa3b5'};

let O,FF,ch=[],TAB='on',IO=null,ST={s:null,e:null,at:'default',att:{meta:'default',google:'default',tt:'default'},cmp:'prev',ord:null,pm0:null,pm1:null,pcust:'nc'};
const fC=v=>'E£ '+Math.round(v).toLocaleString(),fI=v=>Math.round(v).toLocaleString(),fP=v=>(+v).toFixed(2)+'%',fX=v=>(+v).toFixed(2)+'x';
const FM={cur:fC,n:fI,pct:fP,x:fX};
function dl(c,p,gu=1){if(c==null||p==null||!isFinite(c)||!isFinite(p)||(p===0&&c===0))return{cls:'ft',t:'—',p:0};if(!p)return{cls:'ft',t:'new',p:0};const d=c-p,pc=d/p*100;const cls=Math.abs(pc)<.05?'ft':((d>=0)===!!gu?'up':'dn');return{p:pc,cls,t:(d>=0?'+':'−')+Math.abs(pc).toFixed(1)+'% vs prev'};}
function dCh(){ch.forEach(c=>{try{c.destroy()}catch(e){}});ch=[];if(IO){IO.disconnect();IO=null;}}
const SC={rev:1000,gp:1000,refund:1000,orders:1};let DD=[];
function isoDates(){DD=[];const d0=new Date(O.fin.start+'T00:00:00Z');for(let i=0;i<O.fin.n;i++){const d=new Date(d0);d.setUTCDate(d.getUTCDate()+i);DD.push(d.toISOString().slice(0,10));}}
function idxOf(iso,dir){let lo=0,hi=DD.length-1,r=dir>0?DD.length:-1;while(lo<=hi){const m=(lo+hi)>>1;if(DD[m]>=iso){if(dir>0)r=m;hi=m-1;}else{if(dir<0)r=m;lo=m+1;}}return r;}
function rng(s,e){const i0=idxOf(s,1),i1=idxOf(e,-1);return(i0<0||i1<0||i0>i1)?null:[i0,i1];}
function fSum(k,s,e){const r=rng(s,e);if(!r)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=O.fin[k][i]||0;return t*(SC[k]||1);}
function fShop(s,e){const r=rng(s,e);if(!r)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=(O.fin.chD.Shopify[i]||0)*1000;return t;}
function fChan(s,e){const r=rng(s,e),o={};Object.keys(O.fin.chD).forEach(c=>o[c]=0);if(!r)return o;for(let i=r[0];i<=r[1];i++)Object.keys(o).forEach(c=>o[c]+=(O.fin.chD[c][i]||0)*1000);return o;}
function aD(i){const d=new Date(O.ad.start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10);}
function aRange(s,e){const st=O.ad.start,en=aD(O.ad.n-1),os=s>st?s:st,oe=e<en?e:en;if(os>oe)return null;return[Math.max(0,Math.round((Date.parse(os)-Date.parse(st))/864e5)),Math.min(O.ad.n-1,Math.round((Date.parse(oe)-Date.parse(st))/864e5))];}
function aSum(k,r){const A=O.ad[k];if(!A)return 0;let t=0;for(let i=r[0];i<=r[1];i++)t+=A[i]||0;return t;}
function aAvg(k,r){const A=O.ad[k];if(!A)return 0;let t=0,n=0;for(let i=r[0];i<=r[1];i++){if(A[i]){t+=A[i];n++;}}return n?t/n:0;}

function addD(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}

function dec(L,d,max){max=max||120;const n=L.length;if(n<=max)return{L:L.slice(),d:d.slice(),ix:L.map((_,i)=>i)};const out={L:[],d:[],ix:[]},st=n/max;for(let b=0;b<max;b++){const s=Math.floor(b*st),e=Math.min(n,Math.floor((b+1)*st));let sm=0,c=0;for(let i=s;i<e;i++){sm+=d[i];c++;}out.L.push(L[s]);out.d.push(sm/(c||1));out.ix.push(e-1);}return out;}

function cairo(u){try{const t=Date.parse(String(u).replace(' UTC','Z').replace(' ','T'));const d=new Date(t+3*3600*1000);let h=d.getUTCHours(),mi=('0'+d.getUTCMinutes()).slice(-2);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+mi+' '+ap;}catch(e){return String(u);}}

 document.getElementById('sync').innerHTML='↻ Synced <b>'+LSC+'</b> Cairo · next ~<b>'+NXC+'</b>';
 ST.e=O.aw[1];ST.s=addD(ST.e,-29);
 const d0=document.getElementById('d0'),d1=document.getElementById('d1');
 d0.value=ST.s;d1.value=ST.e;d0.min=O.fin.start;d1.max=ST.e;

 const up=MO.slice().sort((a,b)=>b.d-a.d).slice(0,10),dn=MO.slice().sort((a,b)=>a.d-b.d).slice(0,10);
 const mrow=x=>({n:x.r.n,v:x.d,c:x.d>=0?C.grn:C.red,b:(x.d>=0?'+':'&minus;')+Math.abs(x.p).toFixed(0)+'%',
  rl:(x.d>=0?'+':'&minus;')+E+money(x.d),tip:x.r.n+' | last 90 days E£ '+money(x.r.r90)+' vs prior 90 days E£ '+money(x.r.p90)});
 if(up.length)hbar(g,'Supplier momentum &mdash; who is accelerating and who is fading'+INFO('Retail only. Last 90 days of report.pos.order revenue on that supplier templates versus the 90 days immediately before. Suppliers under E£200k in both windows are excluded as noise.'),
  'The ten biggest gainers and the ten biggest losers in absolute pounds over the last 90 days versus the 90 before. Bars are the change in money, the chip is the percentage.',
  up.concat(dn.filter(x=>x.d<0).reverse()).map(mrow),{nw:200,
  cmt:[[C.blue,'<b>Absolute pounds, not percentages, decide the reorder.</b> A small supplier tripling is a nice signal; a large one slipping 12% is a bigger hole in the plan. The bars are sized by money for exactly that reason &mdash; the chip on the right is there to tell you whether the move is a trend or a rounding error.'],
   [C.orange,'<b>Ninety days spans a season.</b> The current window and the comparison window are not the same trading season, so a costume or a swim range will always look violent here. Check the supplier category before reading a fall as a failure.']]});
 // ---------- 7. products ----------
 const P=((O.prodv&&O.prodv.rows)||[]).filter(p=>VFC==='all'||(VFC==='cons'?p.ct==='Consignment':p.ct!=='Consignment'));
 if(P.length){const ph=P.slice(0,80).map(p=>{const t2=p.r+p.orev,gp2=p.g+p.ogp;
   return '<tr title="'+(p.n+' | '+p.vn+' | '+p.cat).replace(/"/g,'&quot;')+'"><td style="padding:4px 7px;font-size:11.5px;font-weight:700;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.n+'</td>'
    +'<td style="padding:4px 7px;font-size:11px;color:#475569;white-space:nowrap">'+p.vn+'</td>'
    +'<td style="padding:4px 7px;font-size:10.5px;color:#94a3b8;white-space:nowrap">'+p.cat+'</td>'
    +'<td style="padding:4px 7px;font-size:10px;font-weight:800;color:'+(p.ct==='Consignment'?'#9d6bff':'#64748b')+'">'+(p.ct||'&mdash;')+'</td>'
    +'<td style="text-align:right;padding:4px 7px;font-size:11.5px;white-space:nowrap">'+fI(p.q)+'</td>'
    +'<td style="text-align:right;padding:4px 7px;font-size:11.5px;font-weight:800;white-space:nowrap">'+E+money(t2)+'</td>'
    +'<td style="text-align:right;padding:4px 7px;font-size:11.5px;white-space:nowrap">'+E+money(gp2)+'</td>'
    +'<td style="text-align:right;padding:4px 7px;font-size:11.5px;font-weight:800;color:'+(t2&&gp2/t2>0.32?'#12a06e':t2&&gp2/t2<0.18?'#e23a63':'#334155')+';white-space:nowrap">'+fP(t2?gp2/t2*100:0)+'</td></tr>';}).join('');
  pnlCard(g,'ins','Product LTV &mdash; the 80 items that carry the business'+INFO('One row per product template, retail plus online, since 1 Aug 2024. Quantity is POS units. Revenue and gross profit combine report.pos.order and sale.order.line so a product sold in both channels appears once with both halves added.'),
   'Ranked by total revenue across every branch and every online channel. Green GP% is above 32%, red is below 18%.',
   '<div style="overflow:auto;max-height:560px"><table style="width:100%;border-collapse:collapse"><thead style="position:sticky;top:0;background:#fff;z-index:2"><tr>'
   +['Product','Supplier','Category','Model','Units','Revenue','Gross profit','GP%'].map((h,i)=>'<th style="text-align:'+(i>=4?'right':'left')+';padding:6px 7px;font-size:10.5px;font-weight:800;color:#64748b;border-bottom:2px solid #e6e9f2;white-space:nowrap">'+h+'</th>').join('')
   +'</tr></thead><tbody>'+ph+'</tbody></table></div>'
   +'<div class="ins" style="margin-top:8px"><div class="row"><span class="dot" style="background:'+C.blue+'"></span><span><b>A low-margin item at the top of this list is not automatically a problem.</b> Some of these are the reason a family walks in. Judge an item by whether its supplier sits right on the quadrant above, not by its own GP% in isolation &mdash; that is the whole point of putting product and vendor on the same tab.</span></div>'
   +'<div class="row"><span class="dot" style="background:'+C.violet+'"></span><span><b>Consignment items flatter your cash position and dilute your margin.</b> They cost nothing to hold, so a book heavy in consignment looks efficient on working capital and thin on GP%. Use the buying-model filter at the top of this tab to see the two halves of your business separately &mdash; the cash half is the one where a buying mistake actually costs you money.</span></div></div>');}
 // ---------- 8. what to do ----------
 const winners=QP.filter(r=>{const t2=r.r+r.orev;return r.ltgp>nAvg&&t2&&(r.g+r.ogp)/t2*100>(tot?gpT/tot*100:0);}).sort((a,b)=>(b.r+b.orev)-(a.r+a.orev)).slice(0,5);
 const losers=QP.filter(r=>{const t2=r.r+r.orev;return r.ltgp<nAvg*0.8&&t2&&(r.g+r.ogp)/t2*100<(tot?gpT/tot*100:0)*0.8;}).sort((a,b)=>(b.r+b.orev)-(a.r+a.orev)).slice(0,5);
 const onlineOnly=V.filter(r=>r.orev>300000&&r.r<r.orev*0.25).slice(0,6);
 const retailOnly=V.filter(r=>r.r>2000000&&r.orev<r.r*0.03).slice(0,6);
 let plan='<div class="ins">';
 if(winners.length)plan+='<div class="row"><span class="dot" style="background:'+C.grn+'"></span><span><b>Widen first: '+winners.map(r=>r.n).join(', ')+'.</b> Each of these clears the network average on BOTH axes &mdash; their own gross margin beats the '+fP(tot?gpT/tot*100:0)+' book average and their buyers are worth more than '+E+money(nAvg)+' in lifetime gross profit. Together they already carry '+E+money(winners.reduce((a,r)=>a+r.r+r.orev,0))+'. The lowest-risk growth move available to you is more depth and more branches on exactly these, because you are not betting on a new supplier relationship, you are removing a distribution constraint on one that already works.</span></div>';
 if(losers.length)plan+='<div class="row"><span class="dot" style="background:'+C.red+'"></span><span><b>Put on notice: '+losers.map(r=>r.n).join(', ')+'.</b> Below average on margin and below average on customer value, while still consuming '+E+money(losers.reduce((a,r)=>a+r.r+r.orev,0))+' of shelf and working capital. That is the cash to fund the row above. Do not delist blind &mdash; check the branch index table first, because one of these may be holding a single catchment together.</span></div>';
 if(onlineOnly.length)plan+='<div class="row"><span class="dot" style="background:'+C.indigo+'"></span><span><b>Online-native, missing from your shelves: '+onlineOnly.map(r=>r.n).join(', ')+'.</b> Each sells materially online while doing under a quarter of that in the seven branches combined. Either the branches never received the range, or the range is genuinely a delivered-to-door purchase. The first is a stocking decision you can fix this month; the second is worth knowing before you buy shelf depth you cannot sell.</span></div>';
 if(retailOnly.length)plan+='<div class="row"><span class="dot" style="background:'+C.orange+'"></span><span><b>Strong in store, invisible online: '+retailOnly.map(r=>r.n).join(', ')+'.</b> Over E£2m of till revenue each and effectively nothing on the website. If the products exist in Odoo they can be listed; if they are already listed they are not being merchandised or advertised. This is the cheapest revenue on this page, because the demand is already proven at the till.</span></div>';
 plan+='<div class="row"><span class="dot" style="background:'+C.blue+'"></span><span><b>What this tab cannot tell you.</b> It has no purchase cost beyond the cost price Odoo already stamps on each sale, no stock-turn and no payment terms. A supplier with a mediocre margin and 30-day terms can be worth more to your cash cycle than a fat-margin supplier you pay on order. When two suppliers look similar here, terms and turn are the tiebreak &mdash; and neither is in this data yet.</span></div></div>';
 pnlCard(g,'ins','So what do you actually plan'+INFO('Every name in this section is selected by a fixed rule over the same numbers shown above: above or below the network average on gross margin and on lifetime gross profit per customer, with a revenue floor so a tiny supplier cannot win a headline.'),
  'Written from the table above every time this tab loads. Nothing here is an opinion that is not visible as a number somewhere on this page.',plan);
}
window.rVend=rVend;
window.rVend=rVend;window.vsort=vsort;window.vfilt=vfilt;window.vbr=vbr;
window.unlock=unlock;window.pnlCtl=pnlCtl;window.rMedia=rMedia;window.rAds=rAds;window.rRetail=rRetail;window.rViz=rViz;window.rIns=rIns;window.brWater=brWater;window.coWater=coWater;window.rPnl=rPnl;window.rPlan=rPlan;window.tab=tab;window.pre=pre;window.rOn=rOn;window.resetOff=resetOff;window.expand=expand;window.prov=prov;window.rReadme=rReadme;window.Q=Q;window.PRV=PRV;window.QK=QK;window.PGRP=PGRP;window.pBody=pBody;window.ctKey=ctKey;window.qsweep=qsweep;window.CTQ=CTQ;window.QGRID=QGRID;window.QT=QT;
</script></body></html>
