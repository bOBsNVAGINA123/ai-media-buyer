<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OurKids — CPA Grid</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="./data.js"></script>
<script src="./cpa_seed.js?v=1790023920"></script>
<style>
:root{
 --ink:#0f1420;--body:#3c4356;--mut:#8a92a6;--faint:#b6bdcc;
 --bg:#f4f5f8;--card:#fff;--line:#e8eaf0;--soft:#f7f8fb;
 --acc:#4f46e5;--accSoft:#eef0fe;
 --red:#dc2650;--redSoft:#fdeef2;--grn:#0c9e6e;--grnSoft:#e9f8f1;
 --amb:#b45309;--ambSoft:#fdf3e3;--vio:#7c3aed;
 --r:16px;--sh:0 1px 2px rgba(16,20,32,.05),0 6px 24px rgba(16,20,32,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
 background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased;font-size:13px}
.wrap{max-width:1560px;margin:0 auto;padding:18px 24px 90px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);
 display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.sub{color:var(--mut);font-size:11.5px;margin-top:2px}
.hsp{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;
 font-size:12px;font-weight:700;color:var(--body);box-shadow:var(--sh)}
.pill b{color:var(--acc);font-weight:800}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:42;background:var(--bg);padding:8px 0 8px}
.tab{padding:8px 16px;border-radius:11px;font-weight:700;font-size:12.5px;cursor:pointer;
 background:var(--card);border:1px solid var(--line);color:var(--body);transition:.12s}
.tab:hover{border-color:var(--acc);color:var(--acc)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* controls */
.bar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end;background:var(--card);
 border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.bar label{display:block;font-size:9.5px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
select,input{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:10px;
 padding:8px 10px;background:var(--soft);color:var(--ink);max-width:210px}
select:focus,input:focus{outline:2px solid var(--accSoft);border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:10px;padding:9px 14px;
 font-weight:700;cursor:pointer;font-size:12.5px}
.btn.g{background:var(--accSoft);color:var(--acc)}
.sp{flex:1}

/* label chips */
.lbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px}
.lb{cursor:pointer;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:700;
 background:var(--card);color:var(--body);border:1px solid var(--line);user-select:none;transition:.1s}
.lb:hover{border-color:var(--acc)}
.lb b{font-weight:800}
.lb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lb.kill{color:var(--red)}.lb.cut{color:var(--amb)}.lb.scale{color:var(--grn)}
.lb.react{color:var(--acc)}.lb.depen{color:var(--amb)}.lb.thin{color:var(--vio)}
.lb.pause,.lb.hold{color:var(--mut)}
.lb.on{color:#fff!important}
.lb.sub{font-size:10.5px;color:var(--mut);background:transparent;border-style:dashed}
.lb.clr{background:var(--redSoft);color:var(--red);border-color:transparent}
.lbsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.lbspace{flex:1}
.fbanner{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:12.5px;
 margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.fbanner b{font-weight:800}
.fbanner .x{margin-left:auto;cursor:pointer;background:rgba(255,255,255,.14);border-radius:9px;padding:6px 12px;font-weight:700}

/* banners: neutral surfaces, severity carried by a hairline accent, never a paint bucket */
.banner{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amb);
 color:var(--body);border-radius:14px;padding:12px 16px;font-size:12px;margin-bottom:12px;
 line-height:1.7;box-shadow:var(--sh)}
.banner b{color:var(--ink)}
.banner.b{border-left-color:var(--acc)}
.banner.r{border-left-color:var(--red)}
.banner.r b:first-child{color:var(--red)}
details.banner summary{list-style:none;color:var(--ink)}
details.banner summary::-webkit-details-marker{display:none}
details.banner summary::before{content:'\203A';display:inline-block;margin-right:7px;color:var(--mut);
 transition:.15s;font-weight:800}
details.banner[open] summary::before{transform:rotate(90deg)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.kpi .k{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.55px}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.7px;margin-top:3px;color:var(--ink)}
.kpi .d{font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.45}
.kpi.go{cursor:pointer;transition:.12s}.kpi.go:hover{border-color:var(--acc);transform:translateY(-1px)}
.kpi.go u{text-decoration-color:var(--acc);color:var(--acc);font-weight:700}

/* cards + sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.card .cs{color:var(--mut);font-size:11.5px;margin-bottom:12px;line-height:1.6}
.hd{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
.hd h2{margin:0;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.hd .n{font-size:12px;color:var(--mut);font-weight:700}
.do{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:13px}
.doc{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;background:var(--card);box-shadow:var(--sh);transition:.12s}
.doc:hover{border-color:var(--acc);transform:translateY(-1px)}
.doc .dch{display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:9px}
.doc .t{font-weight:800;font-size:13.5px;line-height:1.3;color:var(--ink)}
.doc .s{font-size:11.8px;color:var(--body);line-height:1.62;cursor:pointer}
.cstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
 border-radius:11px;overflow:hidden;margin:11px 0 0}
.cs1{background:var(--soft);padding:8px 10px;min-width:0}
.csl{font-size:8.6px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csv{font-size:14.5px;font-weight:800;letter-spacing:-.3px;margin-top:1px;color:var(--ink)}
.css{font-size:9.4px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swing{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;border:1px solid var(--line);border-radius:11px;
 overflow:hidden;margin-top:8px;background:var(--line)}
.swing div{padding:7px 8px;text-align:center;font-size:11.5px;font-weight:800;background:var(--soft)}
.swing .h{display:block;font-size:8.6px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}

/* tables */
.scr{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--card);text-align:right;font-size:9.5px;text-transform:uppercase;
 letter-spacing:.5px;color:var(--mut);padding:9px 9px;border-bottom:1.5px solid var(--line);font-weight:800;white-space:nowrap;cursor:pointer;z-index:2}
th:hover{color:var(--acc)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 9px;border-bottom:1px solid #f1f3f8;text-align:right;white-space:nowrap;color:var(--body)}
tr:hover td{background:var(--soft)}
tr.cl{cursor:pointer}
.nm{max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;color:var(--ink)}
.mut{color:var(--mut)}span.g{color:var(--grn);font-weight:700}span.r{color:var(--red);font-weight:700}

/* tags */
.tg{display:inline-block;padding:3px 9px;border-radius:999px;font-size:9.8px;font-weight:800;letter-spacing:.25px;white-space:nowrap}
.tg::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:currentColor}
.tg{background:var(--soft);border:1px solid var(--line)}
.tg.kill{color:var(--red)}.tg.cut{color:var(--amb)}.tg.scale{color:var(--grn)}
.tg.hold{color:#66708a}.tg.react{color:var(--acc)}.tg.thin{color:var(--vio)}
.tg.depen{color:var(--amb)}.tg.pause,.tg.offok,.tg.offba,.tg.offde{color:#8b94a8}
.ext{flex:none;width:24px;height:24px;border-radius:8px;background:var(--accSoft);color:var(--acc);display:flex;
 align-items:center;justify-content:center;text-decoration:none;font-size:12px;font-weight:800;opacity:.6;transition:.1s}
.ext:hover{opacity:1;background:var(--acc);color:#fff}
.ext.big{width:32px;height:32px;font-size:15px;opacity:.85}
.spark{display:block}

/* transport */
.tp{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tp input[type=range]{flex:1;max-width:440px;accent-color:var(--acc);height:4px}
.tp .mut{font-size:11.5px;font-weight:700}

/* modal */
#modal{display:none;position:fixed;inset:0;z-index:80}
#modal .mbg{position:absolute;inset:0;background:rgba(10,14,26,.55);backdrop-filter:blur(2px)}
#modal .mbx{position:relative;max-width:900px;margin:4vh auto;background:var(--card);border-radius:20px;
 padding:22px 24px;box-shadow:0 30px 90px rgba(0,0,0,.4);max-height:90vh;overflow:auto}
#modal table{font-size:12.5px}#modal td{padding:6px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
@media(max-width:560px){.cstats{grid-template-columns:repeat(2,1fr)}}
.meth{font-size:12.5px;line-height:1.8}.meth h4{margin:16px 0 5px;font-size:13.5px;color:var(--ink)}
.meth code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:11.5px}
.meth li{margin-bottom:5px}
#sctip{position:absolute;opacity:0;pointer-events:none;transition:opacity .12s,left .08s,top .08s;z-index:70;
 background:#101625;color:#fff;border-radius:14px;padding:11px 13px;box-shadow:0 16px 44px rgba(0,0,0,.4);max-width:330px}
#sctip .tw{display:flex;gap:10px;align-items:flex-start}
#sctip .tn{font-weight:800;font-size:12.5px;line-height:1.3;margin-bottom:4px}
#sctip .tl{font-size:11.2px;line-height:1.55;color:#c6d0e2}
#sctip .tl.mut{color:#7f8ba3}
#sctip .tg2{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9.5px;font-weight:800;margin-bottom:4px;color:#fff}
#sctip .tg2.kill{background:var(--red)}#sctip .tg2.cut{background:#e08a2c}#sctip .tg2.scale{background:var(--grn)}
#sctip .tg2.hold{background:#6b7590}#sctip .tg2.react{background:var(--acc)}#sctip .tg2.thin{background:var(--vio)}
#sctip .tg2.depen{background:#d99a16}

/* gate */
.gate{position:fixed;inset:0;background:linear-gradient(135deg,#171b34,#33296b);display:flex;align-items:center;justify-content:center;z-index:99}
.gate .bx{background:#fff;border-radius:22px;padding:36px 32px;width:340px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.45)}
.gate .l2{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--acc),#7c3aed);margin:0 auto 14px;
 display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
.gate h2{margin:0 0 4px;font-size:19px;color:var(--ink)}.gate p{margin:0 0 18px;color:var(--mut);font-size:13px}
.gate input{width:100%;padding:12px;font-size:15px;text-align:center;margin-bottom:12px;max-width:none}
.gate .btn{width:100%;padding:12px;font-size:15px}
.err{color:var(--red);font-size:12.5px;height:16px;margin-top:8px;font-weight:600}
.hide{display:none!important}
.foot{color:var(--faint);font-size:11px;margin-top:24px;line-height:1.7}
</style></head><body>
<div class="gate" id="gate"><div class="bx"><div class="l2">OK</div><h2>OurKids — CPA Grid</h2><p>Enter password to continue</p>
<input id="pw" type="password" placeholder="Password" autocomplete="off"/><button class="btn" onclick="unlock()">Unlock</button><div class="err" id="er"></div></div></div>
<div id="app" class="hide"><div class="wrap">
<div class="top"><div class="logo">OK</div><div><h1>Meta ads — what to do with each one</h1><div class="sub" id="sub"></div></div>
<div class="hsp"></div><div class="pill" id="p1"></div><div class="pill" id="p2"></div><div class="pill" id="p3"></div></div>
<div class="tabs" id="tabs"></div>
<div class="bar">
 <div><label>Judge on</label><select id="judge">
  <option value="gp" selected>Profit (recommended)</option><option value="cpa">CPA only (the post's method)</option></select></div>
 <div><label>Level</label><select id="lvl">
  <option value="ad" selected>Ad</option><option value="set">Ad set</option><option value="cmp">Campaign</option></select></div>
 <div><label>Conversion basis</label><select id="basis">
  <option value="on">Online only (pixel)</option><option value="off">In-store only (offline CAPI)</option>
  <option value="bl" selected>Blended (online + in-store)</option></select></div>
 <div><label>Attribution</label><select id="attr">
  <option value="default" selected>Default · 7d click + 1d view</option>
  <option value="7d">7-day click</option><option value="1d">1-day click</option>
  <option value="incr">Incremental (Meta's own)</option></select></div>
 <div><label>In-store credit</label><select id="hair">
  <option value="ad" selected>Per ad — its own click share</option>
  <option value="1">100% — Meta's claim</option>
  <option value="0.214">21.4% — account incremental</option>
  <option value="0">0% — ignore in-store</option></select></div>
 <div><label>Window</label><select id="win">
  <option value="56">56d mature (drops last 4d)</option><option value="28">28d mature</option>
  <option value="14">14d mature</option><option value="60">60d full (immature tail)</option></select></div>
 <div><label>Target CPA cut</label><select id="tgt">
  <option value="0.10">10%</option><option value="0.15" selected>15%</option>
  <option value="0.20">20%</option><option value="0.25">25%</option></select></div>
 <div><label>Min spend E£</label><input id="mins" type="number" value="5000" step="1000" style="width:96px"/></div>
 <div><label>Anomalies</label><select id="anom">
  <option value="keep" selected>Include everything</option><option value="drop">Exclude anomalies</option>
  <option value="only">Show only anomalies</option></select></div>
 <div><label>Status</label><select id="st">
  <option value="all">All (incl. paused)</option><option value="act">Active only</option><option value="pau">Paused only</option></select></div>
 <div><label>Format</label><select id="fmt">
  <option value="all">All</option><option value="video">Video</option>
  <option value="mixed">Mixed / carousel</option><option value="static">Static</option></select></div>
 <div><label>Funnel</label><select id="fn">
  <option value="all">All</option><option value="TOF">TOF</option><option value="MOF">MOF</option><option value="BOF">BOF</option></select></div>
 <div><label>Chart</label><select id="cmode">
  <option value="gp" selected>Profit per E£1,000</option><option value="cpa">Cost per purchase</option></select></div>
 <div><label>Columns</label><select id="dens">
  <option value="s" selected>Simple</option><option value="f">Everything</option></select></div>
 <div class="sp"></div><button class="btn g" onclick="location.reload()">Refresh</button>
</div>
<div id="body"></div>
<div class="foot" id="ft"></div>
</div></div>
<div id="modal"></div>
<script src="./cpa_app.js?v=1790023920"></script>
</body></html>
